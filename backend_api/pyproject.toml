[project]
name = "zero-day-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.54,<2.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.35,<1.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.18,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.16,<1.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["content/models", "backend_api/content/models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend_api"]
exclude = ["backend_api/content/models/"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = false
