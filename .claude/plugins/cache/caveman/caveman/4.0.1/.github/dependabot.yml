# Weekly, grouped version updates: one PR per ecosystem. Dependabot SECURITY
# updates are a repository setting (Settings -> Code security), not this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # browse/ is a consumer copy of caveman-browse. chromedp 0.21 moved to a
    # generic Action/Command API that browse/cdp.go does not build against;
    # the port belongs upstream, and this copy follows it.
    ignore:
      - dependency-name: "github.com/chromedp/*"
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns: ["*"]

  # pnpm workspace at the root, plus the packages that release from their own
  # npm lockfile.
  - package-ecosystem: npm
    directories:
      - /
      - /extension
      - /packages/sdk/typescript
      - /packages/pi-extension
      - /packages/device-auth
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # The middleware's framework pins are its tested versions and must move
    # together with its compatibility table; the nightly middleware-canary
    # workflow reports new framework releases instead.
    ignore:
      - dependency-name: "ai"
      - dependency-name: "@ai-sdk/*"
      - dependency-name: "openai"
      - dependency-name: "@anthropic-ai/sdk"
      - dependency-name: "@google/genai"
      - dependency-name: "langchain"
      - dependency-name: "@langchain/*"
      - dependency-name: "@strands-agents/sdk"
      - dependency-name: "@mastra/core"
      - dependency-name: "@modelcontextprotocol/sdk"
      # TypeScript 7 drops the JS compiler API that sdk/typescript's
      # cjs-types.mjs builds with, and @types/node majors type runtimes newer
      # than the engines floor (>=22). Both are deliberate migrations.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Pi pin moves by hand: provider-compat.runtime.mjs is a tripwire
      # that needs a compat review of the nested pi-ai on every bump.
      - dependency-name: "@earendil-works/pi-coding-agent"
    groups:
      npm:
        patterns: ["*"]

  # Pinned tool and CI requirement files. The SDK and middleware pyprojects are
  # libraries: their ranges are compatibility claims, not pins to bump.
  - package-ecosystem: pip
    directories:
      - /.github/requirements
      - /shared/provider-catalog
      - /benchmarks
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]
