[project]
name = "zeroday-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroday"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
]
