services:
  web:
    profiles: [online]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    profiles: [online]
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - npc_data:/app/backend_api/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    profiles: [online]
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    profiles: [online]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    profiles: [online]
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    command:
      [
        'uv',
        'run',
        '--no-dev',
        '--project',
        'backend_api',
        'alembic',
        '-c',
        'backend_api/alembic.ini',
        'upgrade',
        'head',
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

volumes:
  npc_data:
  postgres_data:
