services:
  web:
    profiles: [online]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    profiles: [online]
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NPC_MODEL: ${NPC_MODEL:-}
      INJECTION_JUDGE_MODEL: ${INJECTION_JUDGE_MODEL:-}
      ALARM_JUDGE_MODEL: ${ALARM_JUDGE_MODEL:-}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-}
      DIALOGUE_TIMEOUT_SECONDS: ${DIALOGUE_TIMEOUT_SECONDS:-}
      NPC_MAX_TOKENS: ${NPC_MAX_TOKENS:-}
      JUDGE_MAX_TOKENS: ${JUDGE_MAX_TOKENS:-}
      # Claude Code LLM (fallback or, with PRIORITY, primary). HOME points at the
      # mounted credentials so the CLI runs authorized inside the container.
      HOME: /root
      # Skip autoupdater/telemetry/error-reporting startup traffic to cut per-call latency.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      CLAUDE_CODE_FALLBACK: ${CLAUDE_CODE_FALLBACK:-}
      CLAUDE_CODE_PRIORITY: ${CLAUDE_CODE_PRIORITY:-}
      CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-}
      CLAUDE_CODE_BIN: ${CLAUDE_CODE_BIN:-}
    volumes:
      - npc_data:/app/backend_api/data
      # Host-installed, host-authorized Claude Code CLI, mounted read-only.
      - ${CLAUDE_HOST_BIN:-/root/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLAUDE_HOST_CREDS:-/root/.claude}:/root/.claude
      - ${CLAUDE_HOST_CONFIG:-/root/.claude.json}:/root/.claude.json
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "from urllib.request import urlopen; urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  match:
    profiles: [online]
    build:
      context: .
      dockerfile: services/match/Dockerfile
    environment:
      MATCH_PORT: '8090'
    restart: unless-stopped

  redis:
    profiles: [online]
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    profiles: [online]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    profiles: [online]
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    command:
      [
        'uv',
        'run',
        '--no-dev',
        '--project',
        'backend_api',
        'alembic',
        '-c',
        'backend_api/alembic.ini',
        'upgrade',
        'head',
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

volumes:
  npc_data:
  postgres_data:
