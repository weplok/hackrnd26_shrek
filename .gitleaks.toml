[extend]
useDefault = true

[allowlist]
description = "Ignore vendored developer tooling and archived beta prototypes"
paths = [
  '''^\.agents/skills/''',
  '''^\.claude/plugins/(cache|marketplaces)/''',
  '''^\.codex/skills/''',
  '''^\.opencode/skills/''',
  '''^beta/''',
]
# RFC 6455 sample nonce used in the README WebSocket check.
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
