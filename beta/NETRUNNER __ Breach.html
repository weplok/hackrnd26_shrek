const BAND_COLOR = {hi:"var(--green-bright)",mid:"var(--amber)",lo:"var(--mag)"};
function baseEff(tool, def){ return (tool.eff && tool.eff[def] != null) ? tool.eff[def] : 10; }

/* ---------- профиль / сохранение ---------- */
const MAX_UPG = 3, MAX_PERS = 5;
function defaultProfile(nick){
  return { nick:nick, coins:0, completed:{}, best:{},
    owned:{scan:true,exploit:true,brute:true,phish:true},
    upg:{}, pers:0, zeroStock:1 };
}
function loadSave(nick){ try{ const r=localStorage.getItem("breach_save_"+nick); return r?JSON.parse(r):null; }catch(e){ return null; } }
function writeSave(p){ try{ localStorage.setItem("breach_save_"+p.nick, JSON.stringify(p)); localStorage.setItem("breach_lastnick", p.nick); }catch(e){} }
function lastNick(){ try{ return localStorage.getItem("breach_lastnick")||""; }catch(e){ return ""; } }

function noiseMult(pers){ return Math.max(0.4, 1 - 0.12*pers); }
function effChance(tool, def, upg, recon){
  let c = baseEff(tool, def) + 8*(upg||0);
  if(recon) c += 15;
  return Math.min(99, c);
}
function effNoise(tool, profile){
  if(tool.noise <= 0) return tool.noise;
  let n = tool.noise - 2*(profile.upg[tool.id]||0);
  n = Math.round(n * noiseMult(profile.pers));
  return Math.max(1, n);
}
function effPassive(level, profile){ return Math.max(1, level.passive - Math.floor(profile.pers/2)); }
function rewardFor(level, turns, firstClear){
  const over = Math.max(0, turns - level.par);
  let c = Math.max(level.minR, level.maxR - over*level.step);
  if(!firstClear) c = Math.round(c*0.5);
  return c;
}
function levelUnlocked(idx, profile){
  if(idx===0) return true;
  return !!profile.completed[LEVELS[idx-1].id];
}

/* ============================================================
   ROOT APP — маршрутизация экранов
   ============================================================ */
function App(){
  const [screen,setScreen] = useState("menu"); // menu|intro|levels|shop|game|exit
  const [profile,setProfile] = useState(null);
  const [curLevel,setCurLevel] = useState(0);

  useEffect(() => { if(profile) writeSave(profile); }, [profile]);

  function startNew(nick){
    setProfile(defaultProfile(nick));
    setScreen("intro");
  }
  function continueGame(nick){
    const s = loadSave(nick);
    setProfile(s || defaultProfile(nick));
    setScreen("levels");
  }

  if(screen==="menu") return <Menu onNew={startNew} onContinue={continueGame} onExit={()=>setScreen("exit")} />;
  if(screen==="exit") return <ExitSplash onBack={()=>setScreen("menu")} />;
  if(!profile) { setScreen("menu"); return null; }

  if(screen==="intro") return <Intro onDone={()=>setScreen("levels")} />;
  if(screen==="levels") return (
    <LevelSelect profile={profile}
      onPlay={(i)=>{ setCurLevel(i); setScreen("game"); }}
      onShop={()=>setScreen("shop")}
      onMenu={()=>setScreen("menu")} />
  );
  if(screen==="shop") return <Shop profile={profile} setProfile={setProfile} onBack={()=>setScreen("levels")} />;
  if(screen==="game") return (
    <Mission level={LEVELS[curLevel]} profile={profile} setProfile={setProfile}
      onExit={()=>setScreen("levels")} onShop={()=>setScreen("shop")}
      onNext={()=>{ if(curLevel<LEVELS.length-1){ setCurLevel(curLevel+1); } else { setScreen("levels"); } }} />
  );
  return null;
}

}
function Shell(props){

function btn(kind){

  return {background:"transparent",color:"var(--white)",border:"1px solid var(--line)",padding:"12px 22px",letterSpacing:1};
}

    {c:"var(--white)",   t:"Ты — пентестер. «Белая шляпа» (white-hat)."},
    {c:"var(--mut)",     t:"Компании и люди сами нанимают тебя, чтобы ты попробовал взломать их сеть РАНЬШЕ настоящих злоумышленников — и указал, где дыры."},
    {c:"var(--white)",   t:"Каждый узел сети прикрыт своим типом защиты."},
    {c:"var(--mut)",     t:"У каждого инструмента есть защита, против которой он силён, и те, против которых он почти бесполезен. Веди разведку, подбирай связку, запоминай что работает."},
    {c:"var(--mag)",     t:"Любое действие поднимает ТРАССИРОВКУ. Дойдёт до 100% — тебя запеленгуют, задание провалено."},
    {c:"var(--white)",   t:"За быстрые и чистые проходы платят монеты."},
    {c:"var(--mut)",     t:"Монеты — в магазин: новые инструменты, апгрейд старых, прокачка собственной скрытности."},
    {c:"var(--green-bright)", t:"> готов. добро пожаловать в профессию, оператор."},
  ];
  const [n,setN] = useState(0);
  useEffect(()=>{ if(n<lines.length){ const id=setTimeout(()=>setN(n+1), n===0?250:650); return ()=>clearTimeout(id);} },[n]);
  return (
    <Shell>
      <div style={{background:"var(--panel)",border:"1px solid var(--line)",marginTop:20}}>
        <PanelTitle>БРИФИНГ</PanelTitle>
        <div style={{padding:"22px 22px 8px",minHeight:300}}>
          {lines.slice(0,n).map((l,i)=>(
            <p key={i} style={{color:l.c,fontSize:15,lineHeight:1.65,margin:"0 0 14px",animation:"rise .35s"}}>{l.t}</p>
          ))}
          {n<lines.length && <span style={{color:"var(--green)",animation:"blink 1s steps(1) infinite"}}>&#9612;</span>}
        </div>
        <div style={{padding:"8px 22px 22px"}}>
          <button onClick={props.onDone} disabled={n<lines.length}
            style={Object.assign({},btn("solid"))}>К заданиям &#8594;</button>
          {n<lines.length && <button onClick={()=>setN(lines.length)} style={Object.assign({},btn("ghost"),{marginLeft:10})}>пропустить</button>}
        </div>
      </div>
    </Shell>
  );
}

function Shop(props){

  function spend(cost, apply){
    if(p.coins < cost){ setMsg("Недостаточно монет."); return; }
    const np = JSON.parse(JSON.stringify(p));
    np.coins -= cost;
    apply(np);
    props.setProfile(np);
    setMsg("");
  }
  const buyTools = TOOLS.filter(t=>t.price!=null && !p.owned[t.id]);
  const ownedAttack = TOOLS.filter(t=>p.owned[t.id] && t.kind==="attack");

    <Shell wide>
      <TopBar profile={p} onLevels={props.onBack} />
      <h2 style={{fontSize:24,fontWeight:800,margin:"18px 0 4px"}}>Магазин</h2>
      <p style={{color:"var(--mut)",fontSize:13,margin:"0 0 6px"}}>Монеты зарабатываются за быстрые и чистые проходы.</p>
      {msg && <div style={{color:"var(--mag)",fontSize:13,margin:"0 0 10px"}}>{msg}</div>}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginTop:10}} className="shopgrid">

        {/* Новые инструменты */}
        <ShopCard title="НОВЫЕ ИНСТРУМЕНТЫ">
          {buyTools.length===0 && <Empty>Все инструменты куплены.</Empty>}
          {buyTools.map(t=>(
            <Row key={t.id} title={t.name} tag={t.tag} desc={t.desc}
              price={t.price} coins={p.coins}
              onBuy={()=>spend(t.price, np=>{ np.owned[t.id]=true; })} />
          ))}
        </ShopCard>

        {/* Личная защита */}
        <ShopCard title="ЛИЧНАЯ СКРЫТНОСТЬ">
          <div style={{padding:"10px 14px",fontSize:12,color:"var(--mut)",lineHeight:1.5,borderBottom:"1px solid var(--line)"}}>
            Снижает шум от всех действий и пассивный рост трассировки.
            Текущий уровень: <b style={{color:"var(--green-bright)"}}>{p.pers}/{MAX_PERS}</b> → шум ×{noiseMult(p.pers).toFixed(2)}, пассив −{Math.floor(p.pers/2)}.
          </div>
          {p.pers>=MAX_PERS
            ? <Empty>Максимальный уровень скрытности.</Empty>
            : <Row title={"Стелс-профиль ур."+(p.pers+1)} tag="stealth"
                desc={"Шум всех действий ×"+noiseMult(p.pers+1).toFixed(2)+", пассив −"+Math.floor((p.pers+1)/2)+"."}
                price={100*(p.pers+1)} coins={p.coins}
                onBuy={()=>spend(100*(p.pers+1), np=>{ np.pers+=1; })} />}
          <div style={{padding:"10px 14px",borderTop:"1px solid var(--line)"}}>
            <Row title="Заряд 0-day" tag="0day"
              desc={"Универсальная отмычка на любой узел. В запасе: "+p.zeroStock+". Тратится при использовании."}
              price={110} coins={p.coins}
              onBuy={()=>spend(110, np=>{ np.zeroStock+=1; })} />
          </div>
        </ShopCard>

        {/* Апгрейд инструментов */}
        <ShopCard title="АПГРЕЙД ИНСТРУМЕНТОВ" span>
          <div style={{padding:"10px 14px",fontSize:12,color:"var(--mut)",borderBottom:"1px solid var(--line)"}}>
            Каждый уровень: +8% к эффективности и −2 к шуму инструмента.

            {ownedAttack.map((t,idx)=>{

/* ============================================================
   MISSION — собственно взлом
   ============================================================ */
function Mission(props){
  const level = props.level, profile = props.profile, setProfile = props.setProfile;
  const [nodes,setNodes] = useState({});
  const [trace,setTrace] = useState(0);
  const [turns,setTurns] = useState(0);
  const [selected,setSelected] = useState(null);
  const [log,setLog] = useState([]);
  const [discovered,setDiscovered] = useState({});
  const [status,setStatus] = useState("brief"); // brief|play|win|lose
  const [reward,setReward] = useState(0);
  const logRef = useRef(null);

  function reset(){
    const map = {};
    level.nodes.forEach(n => { map[n.id] = { compromised:n.id===level.entry, hidden:!!n.hidden && n.id!==level.entry, recon:false }; });
    const en = level.nodes.find(n=>n.id===level.entry), tg = level.nodes.find(n=>n.id===level.target);
    setNodes(map); setTrace(0); setTurns(0); setSelected(null); setStatus("brief"); setReward(0);
    setLog([
      {t:"> контракт: "+level.name+" ("+level.place+")",k:"sys"},
      {t:"> точка входа ["+(en?en.label:"")+"] под контролем",k:"ok"},
      {t:"> цель: "+level.goal,k:"sys"},
    ]);
  }
  useEffect(()=>{ reset(); }, [level]);
  useEffect(()=>{ if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [log]);

  const nodeById = useMemo(()=>Object.fromEntries(level.nodes.map(n=>[n.id,n])), [level]);
  const reachable = useMemo(()=>{
    const r = new Set();
    for(const e of level.edges){
      const a=e[0],b=e[1];
      if(nodes[a]&&nodes[a].compromised && !(nodes[b]&&nodes[b].compromised)) r.add(b);
      if(nodes[b]&&nodes[b].compromised && !(nodes[a]&&nodes[a].compromised)) r.add(a);
    }
    return r;
  }, [nodes, level]);

  const ownedTools = TOOLS.filter(t=>profile.owned[t.id]);
  function pushLog(t,k){ setLog(l=>l.concat([{t,k}]).slice(-80)); }
  function endTurnTrace(extra){
    setTrace(prev=>{
      const nv = Math.max(0, Math.min(100, prev + extra + effPassive(level,profile)));
      if(nv>=100){ setStatus("lose"); pushLog("!! ТРАССИРОВКА 100% — вас запеленговали.","bad"); }
      return nv;
    });
    setTurns(t=>t+1);
  }

  function useTool(toolId){
    if(status!=="play" || !selected) return;
    const tool = TOOL_BY_ID[toolId];
    const nd = nodes[selected], meta = nodeById[selected];
    if(!nd || nd.compromised) return;
    if(toolId==="zero" ? false : !profile.owned[toolId]) return;

    if(tool.kind==="recon"){
      setNodes(m=>Object.assign({},m,{[selected]:Object.assign({},m[selected],{hidden:false,recon:true})}));
      pushLog("[scan] "+meta.label+": защита = "+DEFENSES[meta.def].name+". +15% к след. атаке.","ok");
      endTurnTrace(effNoise(tool,profile)); return;
    }
    if(tool.kind==="utility"){
      pushLog("[wipe] следы затёрты, трассировка снижена.","ok");
      endTurnTrace(effNoise(tool,profile)); return;
    }

    const chance = effChance(tool, meta.def, profile.upg[tool.id], nd.recon);
    setDiscovered(d=>Object.assign({},d,{[tool.id+":"+meta.def]:baseEff(tool,meta.def)}));
    const roll = Math.random()*100;
    const defName = nd.hidden ? "???" : DEFENSES[meta.def].name;
    pushLog("$ "+tool.tag+" --target "+meta.label+"  (защита: "+defName+", шанс "+chance+"%)","cmd");
    if(roll < chance){
      setNodes(m=>Object.assign({},m,{[selected]:Object.assign({},m[selected],{compromised:true,hidden:false})}));
      pushLog("  ✓ УЗЕЛ ВЗЛОМАН: "+meta.label,"ok");
      endTurnTrace(effNoise(tool,profile));
      if(selected===level.target) setTimeout(()=>finishWin(), 60);
    } else {
      pushLog("  ✗ отбито защитой. Поднят шум.","bad");
      setNodes(m=>Object.assign({},m,{[selected]:Object.assign({},m[selected],{hidden:false})}));
      endTurnTrace(effNoise(tool,profile)+12);
    }
  }

  function useZero(){
    if(status!=="play" || !selected) return;
    if(profile.zeroStock<=0){ pushLog("нет зарядов 0-day","bad"); return; }
    const nd = nodes[selected], meta = nodeById[selected];
    if(!nd || nd.compromised) return;
    const z = TOOL_BY_ID["zero"] || {eff:{FW:62,IDS:60,CRYPT:55,AUTH:55,PATCH:68,EDR:55},noise:22,tag:"0day"};
    // 0-day задаётся прямо здесь (не в owned)
    const effMap = {FW:62,IDS:60,CRYPT:55,AUTH:55,PATCH:68,EDR:55};
    let chance = (effMap[meta.def]||55) + (nd.recon?15:0);
    chance = Math.min(99, chance);
    setProfile(Object.assign({},profile,{zeroStock:profile.zeroStock-1}));
    const roll = Math.random()*100;
    pushLog("$ 0day --target "+meta.label+"  (шанс "+chance+"%, зарядов осталось "+(profile.zeroStock-1)+")","cmd");
    if(roll<chance){
      setNodes(m=>Object.assign({},m,{[selected]:Object.assign({},m[selected],{compromised:true,hidden:false})}));
      pushLog("  ✓ 0-DAY СРАБОТАЛ: "+meta.label,"ok");
      endTurnTrace(Math.max(1, Math.round(22*noiseMult(profile.pers))));
      if(selected===level.target) setTimeout(()=>finishWin(),60);
    } else {
      pushLog("  ✗ 0-day не прошёл. Шум поднят.","bad");
      setNodes(m=>Object.assign({},m,{[selected]:Object.assign({},m[selected],{hidden:false})}));
      endTurnTrace(Math.max(1, Math.round(22*noiseMult(profile.pers)))+12);
    }
  }

  function finishWin(){
    setStatus("win");
    setTurns(tn=>{
      const firstClear = !profile.completed[level.id];
      const coins = rewardFor(level, tn, firstClear);
      setReward(coins);
      const np = JSON.parse(JSON.stringify(profile));
      np.coins += coins;
      np.completed[level.id] = true;
      if(!np.best[level.id] || tn < np.best[level.id]) np.best[level.id] = tn;
      setProfile(np);
      pushLog(">> ЦЕЛЬ ДОСТИГНУТА за "+tn+" ход. Награда: "+coins+" "+COIN,"win");
      return tn;
    });
  }

  const sel = selected ? nodeById[selected] : null;
  const selState = selected ? nodes[selected] : null;
  const traceColor = trace>=75?"var(--mag)":trace>=45?"var(--amber)":"var(--green-bright)";
  const targetOwned = !!(nodes[level.target] && nodes[level.target].compromised);

  return (
    <div style={{maxWidth:1280,margin:"0 auto",padding:"18px 16px 60px",animation:"flicker 7s infinite"}}>
      {/* шапка миссии */}
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",borderBottom:"1px solid var(--line)",paddingBottom:12}}>
        <span style={{fontSize:13,color:"var(--green)"}}>root@breach:~$</span>
        <span style={{fontWeight:800,fontSize:16}}>{level.id} · {level.name}</span>
        <span style={{color:"var(--mut)",fontSize:12}}>{level.place}</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <span style={{color:"var(--gold)",fontWeight:800}}>{COIN} {profile.coins}</span>
          <button onClick={props.onExit} style={Object.assign({},btn("ghost"),{padding:"7px 14px",fontSize:12})}>&#9632; задания</button>
        </div>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:12,margin:"14px 0"}}>
        <Metric label="ТРАССИРОВКА" value={trace+"%"} color={traceColor} bar={trace} barColor={traceColor} />
        <Metric label="ХОДЫ" value={String(turns)} color={turns<=level.par?"var(--green-bright)":"var(--amber)"} sub={"цель ≤"+level.par} />
        <Metric label="0-DAY" value={String(profile.zeroStock)} color={profile.zeroStock>0?"var(--green-bright)":"var(--mut)"} />
        <Metric label="ЦЕЛЬ" value={targetOwned?"ВЗЛОМ":"ЗАКРЫТА"} color={targetOwned?"var(--green-bright)":"var(--mut)"} />
        <button onClick={reset} style={{marginLeft:"auto",alignSelf:"center",background:"transparent",border:"1px solid var(--line)",color:"var(--mut)",padding:"8px 16px",fontSize:12,letterSpacing:1}}>&#8635; RESTART</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr",gap:16}}>
        <div style={{display:"grid",gridTemplateColumns:"minmax(0,1.55fr) minmax(260px,1fr)",gap:16}} className="topgrid">
          <Board level={level} nodes={nodes} reachable={reachable}
                 selected={selected} setSelected={(id)=>{ if(status==="play") setSelected(id); }} />
          <Inspector sel={sel} selState={selState} level={level} tools={ownedTools}
                     profile={profile} onTool={useTool} onZero={useZero} status={status} />
        </div>
        <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:16}} className="botgrid">
          <Codex discovered={discovered} ownedIds={profile.owned} />
          <div style={{background:"var(--panel)",border:"1px solid var(--line)"}}>
            <PanelTitle>КОНСОЛЬ</PanelTitle>
            <div ref={logRef} className="scroll" style={{height:230,overflowY:"auto",padding:"12px 14px",fontSize:12.5,lineHeight:1.7}}>
              {log.map((l,i)=>(<div key={i} style={{color:logColor(l.k),whiteSpace:"pre-wrap"}}>{l.t}</div>))}
              <div style={{color:"var(--green)"}}>root@breach:~$ <span style={{animation:"blink 1s steps(1) infinite"}}>&#9612;</span></div>
            </div>
          </div>
        </div>
      </div>

      {status==="brief" && <BriefOverlay level={level} onStart={()=>setStatus("play")} onExit={props.onExit} />}
      {(status==="win"||status==="lose") && (
        <ResultOverlay status={status} level={level} turns={turns} reward={reward}
          isLast={LEVEL_IDX[level.id]>=LEVELS.length-1}
          onRetry={reset} onShop={props.onShop} onLevels={props.onExit} onNext={props.onNext} />
      )}
    </div>
  );
}

function Metric(props){
  return (
    <div style={{background:"var(--panel)",border:"1px solid var(--line)",padding:"10px 16px",minWidth:120}}>
      <div style={{fontSize:10,letterSpacing:2,color:"var(--mut)"}}>{props.label}</div>
      <div style={{fontSize:22,fontWeight:800,color:props.color}}>{props.value}</div>
      {props.sub && <div style={{fontSize:10,color:"var(--mut)"}}>{props.sub}</div>}
      {typeof props.bar==="number" && (
        <div style={{height:4,background:"var(--line)",marginTop:6}}>
          <div style={{height:"100%",width:props.bar+"%",background:props.barColor,transition:"width .25s"}}/>
        </div>
      )}
    </div>
  );
}
function logColor(k){ return k==="ok"||k==="win"?"var(--green-bright)":k==="bad"?"var(--mag)":k==="cmd"?"var(--white)":"var(--green)"; }

function Board(props){
  const level=props.level, nodes=props.nodes, reachable=props.reachable, selected=props.selected, setSelected=props.setSelected;
  return (
    <div style={{background:"var(--panel)",border:"1px solid var(--line)"}}>
      <PanelTitle>КАРТА СЕТИ</PanelTitle>
      <div style={{position:"relative",width:"100%",aspectRatio:"16/9",
        backgroundImage:"radial-gradient(circle at 1px 1px, rgba(27,59,44,.6) 1px, transparent 0)",backgroundSize:"28px 28px"}}>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{position:"absolute",inset:0,width:"100%",height:"100%"}}>
          {level.edges.map((e,i)=>{
            const a=level.nodes.find(n=>n.id===e[0]), b=level.nodes.find(n=>n.id===e[1]);
            const na=nodes[e[0]], nb=nodes[e[1]];
            const active=(na&&na.compromised)||(nb&&nb.compromised);
            const live=(na&&na.compromised&&reachable.has(e[1]))||(nb&&nb.compromised&&reachable.has(e[0]));
            return <line key={i} x1={a.x} y1={a.y} x2={b.x} y2={b.y}
              stroke={live?"var(--green-bright)":active?"var(--green)":"var(--line)"}
              strokeWidth={live?0.7:0.5} vectorEffect="non-scaling-stroke"
              strokeDasharray={live?"4 4":"0"} style={live?{animation:"dash .6s linear infinite"}:{}} />;
          })}
        </svg>
        {level.nodes.map(n=>{
          const st=nodes[n.id]||{}; const isReach=reachable.has(n.id); const isSel=selected===n.id; const isTarget=n.id===level.target;
          let bg="var(--panel2)",bd="var(--line)",fg="var(--mut)";
          if(st.compromised){ bg="#0c2a1d"; bd="var(--green-bright)"; fg="var(--green-bright)"; }
          else if(isReach){ bd=isTarget?"var(--mag)":"var(--green)"; fg="var(--white)"; }
          const canClick=st.compromised||isReach;
          const statusText=st.compromised?"OWNED":(st.hidden?"[ ?? ]":(isReach?DEFENSES[n.def].short:"— — —"));
          const statusColor=st.compromised?"var(--green)":(isReach?(st.hidden?"var(--amber)":"var(--mut)"):"var(--green-dim)");
          return (
            <button key={n.id} onClick={()=>canClick&&setSelected(n.id)} disabled={!canClick}
              style={{position:"absolute",left:n.x+"%",top:n.y+"%",transform:"translate(-50%,-50%)",
                background:bg,border:"2px solid "+bd,color:fg,padding:"7px 9px",minWidth:84,textAlign:"center",
                outline:isSel?"2px solid var(--white)":"none",outlineOffset:2,
                boxShadow:isSel?"0 0 18px rgba(232,239,233,.25)":"none",
                animation:(isReach&&!st.compromised)?"pulse 1.8s infinite":"none"}}>
              <div style={{fontSize:16,lineHeight:1,color:isTarget?"var(--mag)":fg}}>{KIND_GLYPH[n.kind]}</div>
              <div style={{fontSize:10.5,marginTop:4,fontWeight:700,lineHeight:1.15,maxWidth:96}}>{n.label}</div>
              <div style={{fontSize:9,marginTop:3,letterSpacing:1,color:statusColor}}>{statusText}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Inspector(props){
  const sel=props.sel, selState=props.selState, level=props.level, tools=props.tools, profile=props.profile;
  const onTool=props.onTool, onZero=props.onZero, status=props.status;
  if(!sel||!selState){
    return (
      <div style={{background:"var(--panel)",border:"1px solid var(--line)"}}>
        <PanelTitle>УЗЕЛ</PanelTitle>
        <div style={{padding:20,color:"var(--mut)",fontSize:13,lineHeight:1.7}}>
          Выбери подсвеченный узел на карте.<br/><br/>
          <span style={{color:"var(--green)"}}>&#9673;</span> пульсирует — доступен.<br/>
          <span style={{color:"var(--green-bright)"}}>&#9635; OWNED</span> — под контролем.<br/>
          <span style={{color:"var(--amber)"}}>[ ?? ]</span> — защита скрыта, нужен сканер.
        </div>
      </div>
    );
  }
  const compromised=selState.compromised, hidden=selState.hidden, def=DEFENSES[sel.def];
  return (
    <div style={{background:"var(--panel)",border:"1px solid var(--line)",display:"flex",flexDirection:"column"}}>
      <PanelTitle>{"УЗЕЛ // "+sel.id.toUpperCase()}</PanelTitle>
      <div style={{padding:"14px 14px 6px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22,color:sel.id===level.target?"var(--mag)":"var(--green-bright)"}}>{KIND_GLYPH[sel.kind]}</span>
          <div><div style={{fontWeight:800,fontSize:15}}>{sel.label}</div>
            <div style={{fontSize:11,color:"var(--mut)"}}>{compromised?"статус: под контролем":"статус: цель"}</div></div>
        </div>
        <div style={{marginTop:12,padding:"10px 12px",background:"var(--panel2)",border:"1px solid var(--line)"}}>
          <div style={{fontSize:10,letterSpacing:2,color:"var(--mut)"}}>ЗАЩИТА</div>
          {compromised ? <div style={{color:"var(--green-bright)",fontWeight:700,marginTop:3}}>нейтрализована &#10003;</div>
            : hidden ? <div style={{color:"var(--amber)",fontWeight:700,marginTop:3}}>скрыта — примени «Сканер портов»</div>
            : (<React.Fragment>
                <div style={{color:"var(--white)",fontWeight:700,marginTop:3}}>{def.name}</div>
                <div style={{fontSize:11.5,color:"var(--mut)",marginTop:4,lineHeight:1.5}}>{def.blurb}</div>
              </React.Fragment>)}
          {selState.recon && !compromised && <div style={{fontSize:11,color:"var(--green-bright)",marginTop:6}}>+15% к атаке (разведано)</div>}
        </div>
      </div>
      {!compromised ? (
        <div style={{padding:"4px 14px 14px",display:"flex",flexDirection:"column",gap:7}}>
          <div style={{fontSize:10,letterSpacing:2,color:"var(--mut)",margin:"6px 0 2px"}}>ИНСТРУМЕНТЫ</div>
          {tools.map(t=>{
            const disabled=status!=="play";
            const tagColor=t.kind==="recon"?"var(--green-bright)":(t.kind==="utility"?"var(--amber)":"var(--green)");
            const n=effNoise(t,profile); const up=profile.upg[t.id]||0;
            return (
              <button key={t.id} onClick={()=>onTool(t.id)} disabled={disabled} title={t.desc}
                style={{textAlign:"left",background:"var(--panel2)",border:"1px solid var(--line)",padding:"8px 10px",display:"flex",alignItems:"center",gap:10}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--green)";}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--line)";}}>
                <span style={{fontSize:10,color:tagColor,border:"1px solid var(--line)",padding:"2px 5px",minWidth:52,textAlign:"center"}}>{t.tag}</span>
                <span style={{flex:1}}><span style={{fontSize:12.5,fontWeight:700}}>{t.name}{up>0?(" +"+up):""}</span></span>
                <span style={{fontSize:10,color:n<0?"var(--green-bright)":"var(--mut)"}}>{n<0?("шум "+n):("шум +"+n)}</span>
              </button>
            );
          })}
          <button onClick={onZero} disabled={status!=="play"||profile.zeroStock<=0} title="Универсальная отмычка, тратит заряд"
            style={{textAlign:"left",background:"#1a0a14",border:"1px solid var(--mag)",padding:"8px 10px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:10,color:"var(--mag)",border:"1px solid var(--mag)",padding:"2px 5px",minWidth:52,textAlign:"center"}}>0day</span>
            <span style={{flex:1}}><span style={{fontSize:12.5,fontWeight:700,color:"var(--mag)"}}>Эксплойт 0-day · {profile.zeroStock}</span></span>
            <span style={{fontSize:10,color:"var(--mut)"}}>любая цель</span>
          </button>
        </div>
      ) : (
        <div style={{padding:"4px 14px 16px",color:"var(--green)",fontSize:12.5,lineHeight:1.6}}>
          Узел захвачен. Соседние узлы доступны — ищи путь к цели.
        </div>
      )}
    </div>
  );
}

function Codex(props){
  const discovered=props.discovered, ownedIds=props.ownedIds;
  const attacks=TOOLS.filter(t=>t.kind==="attack");
  return (
    <div style={{background:"var(--panel)",border:"1px solid var(--line)"}}>
      <PanelTitle>СПРАВОЧНИК — ЭФФЕКТИВНОСТЬ</PanelTitle>
      <div className="scroll" style={{padding:"10px 12px",overflowX:"auto"}}>
        <div style={{fontSize:11,color:"var(--mut)",marginBottom:8,lineHeight:1.5}}>
          Связки раскрываются по мере применения. Серым — ещё не куплено.
        </div>
        <table style={{borderCollapse:"collapse",width:"100%",fontSize:11}}>
          <thead><tr>
            <th style={{textAlign:"left",padding:"4px 6px",color:"var(--mut)",fontWeight:400}}>инстр. &#9586; защита</th>
            {DEF_ORDER.map(d=>(<th key={d} style={{padding:"4px 6px",color:"var(--white)",fontWeight:700,borderLeft:"1px solid var(--line)"}}>{DEFENSES[d].short}</th>))}
          </tr></thead>
          <tbody>
            {attacks.map(t=>{
              const owned=!!ownedIds[t.id];
              return (
                <tr key={t.id} style={{borderTop:"1px solid var(--line)",opacity:owned?1:.5}}>
                  <td style={{padding:"5px 6px",color:owned?"var(--green)":"var(--mut)",whiteSpace:"nowrap"}}>{t.tag}{owned?"":" 🔒"}</td>
                  {DEF_ORDER.map(d=>{
                    const known=Object.prototype.hasOwnProperty.call(discovered,t.id+":"+d);
                    const b=band(baseEff(t,d));
                    const glyph=known?(b==="hi"?"███":(b==="mid"?"▓▓":"░")):"·";
                    return <td key={d} style={{padding:"5px 6px",textAlign:"center",borderLeft:"1px solid var(--line)",color:known?BAND_COLOR[b]:"var(--green-dim)",fontWeight:known?700:400}}>{glyph}</td>;
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{display:"flex",gap:14,marginTop:10,fontSize:10.5,flexWrap:"wrap"}}>
          <span style={{color:"var(--green-bright)"}}>&#9608;&#9608;&#9608; высокая</span>
          <span style={{color:"var(--amber)"}}>&#9619;&#9619; средняя</span>
          <span style={{color:"var(--mag)"}}>&#9617; низкая</span>
          <span style={{color:"var(--green-dim)"}}>&#183; неизвестно</span>
        </div>
      </div>
    </div>
  );
}

function BriefOverlay(props){
  const lv=props.level;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,zIndex:50}}>
      <div style={{background:"var(--panel)",border:"2px solid var(--green)",maxWidth:520,width:"100%",animation:"rise .4s"}}>
        <PanelTitle>{"КОНТРАКТ // "+lv.id}</PanelTitle>
        <div style={{padding:"22px 24px"}}>
          <h2 style={{margin:"0 0 4px",fontSize:24,fontWeight:800}}>{lv.name}</h2>
          <div style={{fontSize:12,color:"var(--green)",letterSpacing:1,marginBottom:14}}>{lv.place}</div>
          <p style={{color:"var(--mut)",fontSize:13.5,lineHeight:1.6,margin:"0 0 16px"}}>{lv.brief.replace("小","")}</p>
          <div style={{background:"var(--panel2)",border:"1px solid var(--line)",padding:"12px 14px",fontSize:13}}>
            <div><span style={{color:"var(--mag)"}}>◉ Цель:</span> {lv.goal}</div>
            <div style={{color:"var(--mut)",marginTop:6}}>Награда до <b style={{color:"var(--gold)"}}>{COIN}{lv.maxR}</b> за ≤{lv.par} ходов (дальше — меньше).</div>
          </div>
          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={props.onStart} style={btn("solid")}>НАЧАТЬ ВЗЛОМ →</button>
            <button onClick={props.onExit} style={btn("ghost")}>назад</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ResultOverlay(props){
  const win=props.status==="win";
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,zIndex:50}}>
      <div style={{background:"var(--panel)",border:"2px solid "+(win?"var(--green-bright)":"var(--mag)"),maxWidth:470,width:"100%",padding:"28px 26px",textAlign:"center",animation:"rise .4s"}}>
        <div style={{fontSize:13,letterSpacing:3,color:"var(--mut)"}}>{props.level.name}</div>
        <h2 style={{margin:"10px 0 6px",fontSize:34,fontWeight:800,color:win?"var(--green-bright)":"var(--mag)"}}>{win?"ДОСТУП ПОЛУЧЕН":"ВАС ЗАСЕКЛИ"}</h2>
        {win ? (
          <React.Fragment>
            <p style={{color:"var(--mut)",fontSize:13.5,lineHeight:1.6,margin:"0 0 10px"}}>Цель скомпрометирована за {props.turns} ход. Отчёт заказчику отправлен.</p>
            <div style={{fontSize:30,fontWeight:800,color:"var(--gold)",margin:"6px 0 20px"}}>+{props.reward} {COIN}</div>
            <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
              <button onClick={props.onShop} style={btn("gold")}>&#128179; магазин</button>
              {!props.isLast
                ? <button onClick={props.onNext} style={btn("solid")}>следующий контракт →</button>
                : <button onClick={props.onLevels} style={btn("solid")}>все контракты пройдены ✓</button>}
              <button onClick={props.onLevels} style={btn("ghost")}>к заданиям</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <p style={{color:"var(--mut)",fontSize:13.5,lineHeight:1.6,margin:"0 0 22px"}}>Трассировка достигла предела — защита запеленговала канал. Попробуй тише: разведка, стелс-инструменты, чистка логов.</p>
            <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
              <button onClick={props.onRetry} style={btn("solid")}>&#8635; заново</button>
              <button onClick={props.onShop} style={btn("gold")}>&#128179; магазин</button>
              <button onClick={props.onLevels} style={btn("ghost")}>к заданиям</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

const rootEl=document.getElementById("root");
rootEl.innerHTML="";
ReactDOM.createRoot(rootEl).render(<App/>);
</script>
</body>
</html>
